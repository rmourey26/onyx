<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="kronovaDarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0047AB"/>
      <stop offset="50%" style="stop-color:#0088CC"/>
      <stop offset="100%" style="stop-color:#00CED1"/>
    </linearGradient>
    <linearGradient id="kronovaDarkGradientReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00CED1"/>
      <stop offset="100%" style="stop-color:#0047AB"/>
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="400" height="100" fill="#0A0F1C"/>
  
  <!-- Icon -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#kronovaDarkGradient)" stroke-width="2.5"/>
    <path d="M25 20 L25 60 M25 40 L55 20 M25 40 L55 60" 
          stroke="url(#kronovaDarkGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="20" r="4" fill="url(#kronovaDarkGradient)"/>
    <circle cx="25" cy="40" r="5" fill="url(#kronovaDarkGradient)"/>
    <circle cx="25" cy="60" r="4" fill="url(#kronovaDarkGradient)"/>
    <circle cx="55" cy="20" r="4" fill="url(#kronovaDarkGradientReverse)"/>
    <circle cx="55" cy="60" r="4" fill="url(#kronovaDarkGradientReverse)"/>
  </g>
  
  <!-- Wordmark - white for dark background -->
  <text x="105" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">
    KRONOVA
  </text>
  
  <!-- Tagline -->
  <text x="107" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#9CA3AF" letter-spacing="2">
    INTELLIGENT SYSTEMS
  </text>
</svg>
