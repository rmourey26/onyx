<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="eternalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0047AB"/>
      <stop offset="100%" style="stop-color:#00CED1"/>
    </linearGradient>
    
    <linearGradient id="horizonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00CED1"/>
      <stop offset="100%" style="stop-color:#0047AB"/>
    </linearGradient>
  </defs>
  
  <!-- Infinity symbol foundation - timelessness -->
  <path d="M30 60 C30 45, 45 45, 60 60 C75 75, 90 75, 90 60 C90 45, 75 45, 60 60 C45 75, 30 75, 30 60" 
        fill="none" stroke="url(#eternalGradient)" stroke-width="2.5" opacity="0.3"/>
  
  <!-- Central ascending pillar - transcendence -->
  <rect x="55" y="25" width="10" height="70" rx="5" fill="url(#horizonGradient)" opacity="0.9"/>
  
  <!-- Crown of enlightenment -->
  <path d="M45 30 L60 15 L75 30" fill="none" stroke="url(#eternalGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Radiating knowledge beams -->
  <line x1="60" y1="15" x2="60" y2="5" stroke="#00CED1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="30" x2="38" y2="23" stroke="#00CED1" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="75" y1="30" x2="82" y2="23" stroke="#00CED1" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Grounding base - connection to reality -->
  <ellipse cx="60" cy="100" rx="25" ry="5" fill="url(#eternalGradient)" opacity="0.2"/>
  
  <!-- Orbital paths - infinite cycles -->
  <ellipse cx="60" cy="60" rx="40" ry="15" fill="none" stroke="url(#eternalGradient)" stroke-width="1" opacity="0.4" transform="rotate(-20 60 60)"/>
  <ellipse cx="60" cy="60" rx="40" ry="15" fill="none" stroke="url(#eternalGradient)" stroke-width="1" opacity="0.4" transform="rotate(20 60 60)"/>
  
  <!-- Wordmark - ethereal typography -->
  <text x="130" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="100" letter-spacing="12" fill="url(#eternalGradient)">KRONOVA</text>
  
  <!-- Prophetic tagline -->
  <text x="130" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" letter-spacing="6" fill="#0077BE" opacity="0.7">THE FUTURE SPEAKS</text>
</svg>
