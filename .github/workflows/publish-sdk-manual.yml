name: Publish SDK (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.1) — updates package.json before publishing"
        required: false
        default: ""
      tag:
        description: "NPM dist-tag (e.g. latest, beta, next)"
        required: false
        default: "latest"

jobs:
  publish:
    name: Build & Publish @kronova-intelligent-systems/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Bump version (optional)
        if: ${{ inputs.version != '' }}
        working-directory: lib/sdk
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Install build deps
        working-directory: lib/sdk
        run: npm install

      - name: Compile — ESM
        working-directory: lib/sdk
        run: npx tsc -p tsconfig.esm.json

      - name: Compile — CJS
        working-directory: lib/sdk
        run: npx tsc -p tsconfig.cjs.json

      - name: Compile — Types
        working-directory: lib/sdk
        run: npx tsc -p tsconfig.types.json

      - name: Publish to NPM
        working-directory: lib/sdk
        run: npm publish --access public --tag ${{ inputs.tag }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
